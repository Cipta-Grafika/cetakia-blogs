name: CD Staging Public Next.js

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Next.js Public Staging to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            export PATH=$PATH:/usr/local/bin:/usr/bin

            APP_NAME="cetakia-public-staging"
            BRANCH="staging"
            PORT="3001"
            REPO_URL="https://github.com/Cipta-Grafika/cetakia-blogs.git"

            SRC_DIR="$HOME/cetakia-public-staging-src"
            BASE_DIR="/var/www/cetakia-public-staging"
            RELEASES_DIR="$BASE_DIR/releases"
            SHARED_DIR="$BASE_DIR/shared"
            CURRENT_LINK="$BASE_DIR/current"
            ECOSYSTEM_FILE="$BASE_DIR/ecosystem.config.cjs"

            GIT_SHA="${{ github.sha }}"
            SHORT_SHA="${GIT_SHA:0:7}"
            RELEASE_ID="$(date +%Y%m%d%H%M%S)-$SHORT_SHA"
            RELEASE_DIR="$RELEASES_DIR/$RELEASE_ID"

            echo "Node version: $(node -v)"
            echo "NPM version: $(npm -v)"

            echo "Ensuring pnpm is available..."
            if command -v corepack >/dev/null 2>&1; then
              corepack enable
              corepack prepare pnpm@latest --activate
            fi

            if ! command -v pnpm >/dev/null 2>&1; then
              echo "pnpm not found. Installing pnpm globally..."
              npm install -g pnpm
            fi

            echo "PNPM version: $(pnpm -v)"

            echo "Ensuring PM2 is available..."
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "PM2 not found. Installing PM2 globally..."
              npm install -g pm2
            fi

            echo "PM2 version: $(pm2 -v)"

            echo "Starting Next.js SSR staging deployment..."
            echo "Repository: $REPO_URL"
            echo "Branch: $BRANCH"
            echo "Release ID: $RELEASE_ID"

            echo "Ensuring deployment directories..."
            mkdir -p "$RELEASES_DIR" "$SHARED_DIR"

            if [ ! -d "$SRC_DIR/.git" ]; then
              echo "Source repository not found. Cloning public repository..."
              git clone -b "$BRANCH" "$REPO_URL" "$SRC_DIR"
            fi

            echo "Pulling latest code from $BRANCH..."
            cd "$SRC_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd

            echo "Loading build/runtime environment if available..."
            set -a
            [ -f "$SHARED_DIR/.env.production" ] && . "$SHARED_DIR/.env.production"
            set +a

            echo "Installing dependencies with pnpm..."
            if [ -f "pnpm-lock.yaml" ]; then
              pnpm install --frozen-lockfile
            else
              echo "WARNING: pnpm-lock.yaml not found. Running pnpm install without frozen lockfile."
              pnpm install
            fi

            echo "Building Next.js app with pnpm..."
            pnpm run build

            echo "Validating standalone build output..."
            test -f ".next/standalone/server.js"
            test -d ".next/static"

            echo "Creating release directory..."
            mkdir -p "$RELEASE_DIR"

            echo "Copying standalone server..."
            rsync -a --delete ".next/standalone/" "$RELEASE_DIR/"

            echo "Copying Next.js static assets..."
            mkdir -p "$RELEASE_DIR/.next"
            rsync -a --delete ".next/static/" "$RELEASE_DIR/.next/static/"

            echo "Copying public assets..."
            if [ -d "public" ]; then
              rsync -a --delete "public/" "$RELEASE_DIR/public/"
            fi

            echo "Linking env file if available..."
            if [ -f "$SHARED_DIR/.env.production" ]; then
              ln -sfn "$SHARED_DIR/.env.production" "$RELEASE_DIR/.env.production"
            fi

            echo "Writing PM2 ecosystem file..."
            cat > "$ECOSYSTEM_FILE" <<EOF
            module.exports = {
              apps: [
                {
                  name: '$APP_NAME',
                  cwd: '$CURRENT_LINK',
                  script: 'server.js',
                  exec_mode: 'fork',
                  instances: 1,
                  env: {
                    NODE_ENV: 'production',
                    PORT: $PORT,
                    HOSTNAME: '127.0.0.1'
                  },
                  max_memory_restart: '500M',
                  watch: false
                }
              ]
            };
            EOF

            echo "Activating new release..."
            ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

            echo "Starting or reloading PM2 process..."
            pm2 startOrReload "$ECOSYSTEM_FILE" --only "$APP_NAME" --update-env

            echo "Saving PM2 process list..."
            pm2 save

            echo "Cleaning old releases, keeping latest 5..."
            ls -dt "$RELEASES_DIR"/* 2>/dev/null | tail -n +6 | xargs -r rm -rf

            echo "Testing local Next.js server..."
            sleep 3
            curl -I "http://127.0.0.1:$PORT" || exit 1
            curl -I "http://127.0.0.1:$PORT/about" || exit 1
            curl -I "http://127.0.0.1:$PORT/blogs" || exit 1
            curl -I "http://127.0.0.1:$PORT/contact-us" || exit 1

            echo "Deployment completed successfully!"